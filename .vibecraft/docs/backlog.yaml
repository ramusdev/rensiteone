phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные секции реализовывать не нужно.
    priority: high
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Данные отображаются из статических заглушек
    depends_on: []
    related_feature: Обзор возможностей
    status: completed
    summary: "Создана главная страница VPN-лендинга с отображением статических
      данных из lib/data.ts: название сервиса (VpnSecure), теглайн, описание и
      три статистических показателя (страны, серверы, пользователи). Основная
      реализация: app/page.tsx — страница с иконкой, названием и статами;
      lib/data.ts — статические данные-заглушки; app/layout.tsx — обновлён
      appName."
  - id: task-002
    phase: mvp
    title: Hero-секция и блоки возможностей
    description:
      Реализовать hero-секцию с заголовком, подзаголовком и CTA-кнопкой,
      а также блоки с ключевыми возможностями VPN (шифрование, отсутствие логов,
      скорость, приватность, простота) с иконками и описаниями в стиле
      glassmorphism.
    priority: high
    acceptance_criteria:
      - Hero-секция с заголовком, подзаголовком и CTA отображается при загрузке
      - Блоки с 3–5 возможностями отображаются с иконками и описаниями
      - Все элементы выполнены в стиле glassmorphism (тёмная тема, размытые
        фоны, стеклянные карточки)
    depends_on:
      - task-001
    related_feature: Обзор возможностей
    status: completed
    summary: "Реализована hero-секция с заголовком (теглайн из data.ts),
      подзаголовком и двумя CTA-кнопками («Начать бесплатно», «Подробнее») в
      стиле glassmorphism. Добавлены 5 карточек возможностей (шифрование,
      скорость, без логов, глобальный доступ, все платформы) с иконками
      lucide-react и glassmorphism-стилями (backdrop-blur, border-white/10,
      bg-white/5). Основная реализация: components/hero-section.tsx,
      components/feature-cards.tsx, app/page.tsx. В layout.tsx добавлен класс
      dark для тёмной темы."
