      гарантии возврата средств.
    priority: high
    acceptance_criteria:
      - Отображаются 3 тарифных плана в виде карточек
      - У каждого плана указана цена и список возможностей
      - Рекомендуемый план визуально выделен
      - Кнопка выбора тарифа работает
      - Отображается информация о 30-дневной гарантии возврата
    depends_on:
      - task-003
    related_feature: Тарифы и подписка
    status: completed
    summary: "Реализована секция тарифов с 3 карточками (1 месяц, 6 месяцев, 12
      месяцев), ценами со скидками и списком возможностей. Рекомендуемый план (6
