    phase: mvp
    title: Секция социального доказательства
    description:
      Реализовать секцию с рейтингом (4.8/5), количеством пользователей
      (1M+) и загрузок, 3–4 карточками отзывов клиентов и логотипами
      изданий/наград в стиле glassmorphism.
    priority: high
    acceptance_criteria:
      - Отображается рейтинг 4.8/5
      - Отображается количество пользователей 1M+ и загрузок
      - Отображаются 3–4 карточки с отзывами
      - Присутствуют логотипы изданий или наград
      - Стиль glassmorphism
    depends_on:
      - task-002
    related_feature: Социальное доказательство и доверие
    status: completed
    summary: "Реализована секция социального доказательства с рейтингом 4.8/5
      (звёзды + средняя оценка), статистикой пользователей (1M+) и загрузок
      (3.2M+), 4 карточками отзывов клиентов и логотипами изданий (TechCrunch,
      Wired, Forbes, The Verge, CNET). Все элементы выполнены в стиле
      glassmorphism. Основная реализация: components/social-proof.tsx,
      lib/data.ts (типы Review, Publication, SocialProof + данные), app/page.tsx
      (подключение компонента)."
